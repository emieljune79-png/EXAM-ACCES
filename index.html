<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exam Access Request</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #1565c0;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 500px;
      padding: 36px;
      border-radius: 20px;
      background: rgba(7, 15, 25, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #dbeafe;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 29px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #aeb8c4;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      color: #d5dce5;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.055);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #60a5fa;
    }

    input::placeholder {
      color: #697786;
    }

    button {
      width: 100%;
      margin-top: 27px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #1976d2;
      color: white;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2196f3;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      color: #aeb8c4;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      color: #65c58a !important;
    }

    .error {
      color: #ff7777 !important;
    }

    .key-box {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      font-size: 12px;
      color: #60a5fa;
      word-break: break-all;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 10px;
      color: #657383;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="badge">
        ACADEMY ACCESS SYSTEM
      </div>

      <h1>
        EXAM ACCESS REQUEST
      </h1>

      <div class="subtitle">
        Enter your information below to request examination access.
      </div>

    </div>

    <form id="requestForm">

      <label for="roblox">
        ROBLOX USERNAME
      </label>

      <input
        id="roblox"
        type="text"
        placeholder="Enter your Roblox username"
        autocomplete="off"
        required
      >

      <label for="discord">
        DISCORD USERNAME
      </label>

      <input
        id="discord"
        type="text"
        placeholder="Enter your Discord username"
        autocomplete="off"
        required
      >

      <button
        id="submitButton"
        type="submit"
      >
        SUBMIT REQUEST
      </button>

    </form>

    <div id="message"></div>

    <div id="keyBox" class="key-box"></div>

    <div class="footer">
      FINAL EXAM ACCESS
    </div>

  </div>

  <script>

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyIqvyDTvOGr8EmNxY0vhKOCaDcJHrrHSgvFpsYxqb6g97uaQTd2kE31rPUeDZTeDsjVq/exec";


    const form =
      document.getElementById("requestForm");

    const robloxInput =
      document.getElementById("roblox");

    const discordInput =
      document.getElementById("discord");

    const submitButton =
      document.getElementById("submitButton");

    const message =
      document.getElementById("message");

    const keyBox =
      document.getElementById("keyBox");


    function jsonpRequest(params, callback) {

      const callbackName =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

      params.callback = callbackName;

      const query =
        new URLSearchParams(params).toString();

      const script =
        document.createElement("script");

      let finished = false;

      const timeout =
        setTimeout(function() {

          if (finished) return;

          finished = true;

          cleanup();

          callback({
            success: false,
            message:
              "Connection timeout. Please try again."
          });

        }, 15000);


      window[callbackName] =
        function(data) {

          if (finished) return;

          finished = true;

          clearTimeout(timeout);

          cleanup();

          callback(data);

        };


      script.src =
        APPS_SCRIPT_URL +
        "?" +
        query;


      script.onerror =
        function() {

          if (finished) return;

          finished = true;

          clearTimeout(timeout);

          cleanup();

          callback({
            success: false,
            message:
              "Connection error. Please try again."
          });

        };


      document.body.appendChild(script);


      function cleanup() {

        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(script);

        }

        try {

          delete window[callbackName];

        } catch (error) {

          window[callbackName] = undefined;

        }

      }

    }


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const roblox =
          robloxInput.value.trim();

        const discord =
          discordInput.value.trim();


        if (!roblox || !discord) {

          message.className = "error";

          message.innerText =
            "Please enter both your Roblox and Discord username.";

          return;

        }


        submitButton.disabled = true;

        submitButton.innerText =
          "SUBMITTING...";

        message.className = "";

        message.innerText =
          "Submitting your request...";

        keyBox.style.display = "none";


        jsonpRequest(

          {
            action: "submit",
            roblox: roblox,
            discord: discord
          },

          function(result) {

            if (
              result &&
              result.success
            ) {

              message.className =
                "success";

              message.innerText =
                "Request submitted successfully.";


              if (result.accessKey) {

                keyBox.style.display =
                  "block";

                keyBox.innerText =
                  "ACCESS KEY: " +
                  result.accessKey;

              }


              if (result.url) {

                setTimeout(
                  function() {

                    window.location.href =
                      result.url;

                  },
                  1200
                );

              } else {

                submitButton.disabled =
                  false;

                submitButton.innerText =
                  "SUBMIT REQUEST";

              }

              return;

            }


            message.className =
              "error";

            message.innerText =
              result &&
              result.message
                ? result.message
                : "Unable to submit request.";

            submitButton.disabled =
              false;

            submitButton.innerText =
              "SUBMIT REQUEST";

          }

        );

      }

    );

  </script>

</body>
</html>
